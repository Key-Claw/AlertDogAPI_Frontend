<!DOCTYPE html>
<html class="scroll-smooth" lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Registrar perro - Canem</title>

    <!-- Tailwind CDN (mantener) -->
    <script type="module" src="/assets/js/tailwind.config.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- Tipografía y estilos adicionales -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"/>
    <link href="/assets/css/style.css" rel="stylesheet"/>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet"/>

    <!-- Scripts -->
    <script defer src="/assets/js/scripts.js"></script>

  </head>

  <body class="font-body antialiased bg-gray-50 text-gray-700">
    <!-- Header -->
    <header class="fixed w-full z-50 transition-all duration-300 bg-white/90 backdrop-blur border-b border-white/20">
      <div class="container mx-auto px-6 py-4 flex items-center justify-between">
        <a class="flex items-center gap-3 group" href="/pages/public/index.html">
          <img src="/public/favicon.jpeg" alt="Canem logo" class="w-10 h-10 rounded-xl object-cover shadow-sm" />
          <span class="text-2xl font-bold text-gray-900">Canem</span>
        </a>

        <nav class="hidden md:flex items-center gap-8">
            <a class="text-accent font-medium hover:text-primary transition-colors" href="/pages/public/index.html">Inicio</a>
            <a class="text-accent font-medium hover:text-primary transition-colors" href="/pages/public/services.html">Servicios</a>
            <a class="text-accent font-medium hover:text-primary transition-colors" href="/pages/public/about.html">Conócenos</a>
            <a class="text-accent font-medium hover:text-primary transition-colors" href="/pages/public/contact.html">Contacto</a>
        </nav>

        <div class="hidden md:flex items-center gap-4" id="header-actions">
          <!-- Header actions will be rendered here -->
        </div>

        <button id="mobile-menu-toggle" class="md:hidden w-10 h-10 rounded-xl bg-white shadow flex items-center justify-center">
          <i class="fas fa-bars"></i>
        </button>
      </div>

      <!-- Mobile menu -->
      <div id="mobile-menu" class="hidden px-6 pb-6">
        <div id="mobile-header-actions">
          <!-- Mobile header actions will be rendered here -->
        </div>
        <a class="block py-2" href="/pages/public/index.html">Inicio</a>
        <a class="block py-2" href="/pages/public/services.html">Servicios</a>
        <a class="block py-2" href="/pages/public/about.html">Conócenos</a>
        <a class="block py-2" href="/pages/public/contact.html">Contacto</a>
      </div>
    </header>

    <!-- Formulario registro perro -->
    <main class="pt-28 min-h-screen flex items-center">
      <div class="container mx-auto px-6 max-w-md">
        <div class="soft-card p-8 md:p-12">
          <h1 class="text-3xl font-bold text-gray-900 mb-2">Registrar perro</h1>
          <p class="text-gray-600 mb-6">Añade un perro para poder gestionarlo desde tu panel.</p>

          <form id="perroForm" class="space-y-4" novalidate>
            <div>
              <label for="perro-nombre" class="block text-gray-600 mb-2 font-semibold">Nombre</label>
              <input id="perro-nombre" name="nombre" class="soft-input w-full px-4 py-3" placeholder="Ej. Max" type="text" required />
            </div>

            <div>
              <label for="perro-raza" class="block text-gray-600 mb-2 font-semibold">Raza</label>
              <input id="perro-raza" name="raza" class="soft-input w-full px-4 py-3" placeholder="Ej. Labrador" type="text" required />
            </div>

            <div>
              <label for="perro-genero" class="block text-gray-600 mb-2 font-semibold">Género</label>
              <select id="perro-genero" name="genero" class="soft-input w-full px-4 py-3" required>
                <option value="">Selecciona género</option>
                <option value="1">Macho</option>
                <option value="0">Hembra</option>
              </select>
            </div>

            <div>
              <label for="perro-fecha" class="block text-gray-600 mb-2 font-semibold">Fecha de nacimiento</label>
              <input id="perro-fecha" name="fecha_de_nacimiento" class="soft-input w-full px-4 py-3" type="date" />
            </div>

            <div>
              <label for="perro-usuario" class="block text-gray-600 mb-2 font-semibold">Usuario propietario</label>
              <select id="perro-usuario" name="id_usuario" class="soft-input w-full px-4 py-3" required>
                <option value="">Cargando usuarios...</option>
              </select>
            </div>

            <!-- estado / mensajes -->
            <div id="form-status" class="text-sm min-h-[1.5rem] text-center text-gray-600"></div>

            <!-- boton -->
            <button id="perroBtn" class="soft-btn-primary w-full py-3 font-bold text-lg rounded-xl" type="submit">
              Enviar
            </button>
          </form>

          <p class="mt-6 text-center text-gray-600">
            <a class="text-[var(--canem-primary)] font-bold" href="../app/hogar.html">Volver al panel</a>
          </p>
        </div>
      </div>
    </main>

    <footer class="bg-white/80 border-t mt-8">
      <div class="container mx-auto px-6 py-6 text-center text-gray-500">
        © <span id="year"></span> Canem. Todos los derechos reservados.
      </div>
    </footer>

    <script>
      document.addEventListener('DOMContentLoaded', async () => {
        // año
        const y = document.getElementById('year');
        if (y) y.textContent = new Date().getFullYear();

        // max fecha = hoy
        const fechaInput = document.getElementById('perro-fecha');
        if (fechaInput) {
          const hoy = new Date().toISOString().split('T')[0];
          fechaInput.max = hoy;
        }

        // mobile menu toggle
        const btn = document.getElementById('mobile-menu-toggle');
        const menu = document.getElementById('mobile-menu');
        if (btn && menu) btn.addEventListener('click', () => menu.classList.toggle('hidden'));

        // render header actions
        if (window.renderHeaderActions) renderHeaderActions();

        const status = document.getElementById('form-status');
        const form = document.getElementById('perroForm');
        const submitBtn = document.getElementById('perroBtn');
        const userSelect = document.getElementById('perro-usuario');
        const query = new URLSearchParams(location.search);
        const editingId = query.get('id');

        const currentUser = window.canemGetUser ? window.canemGetUser() : (() => {
          try {
            return JSON.parse(localStorage.getItem('canem_user') || 'null');
          } catch (_) {
            return null;
          }
        })();
        const isAdmin = currentUser && (currentUser.rol === 1 || currentUser.rol === '1' || currentUser.rol === true);
        if (!currentUser || !currentUser.id) {
          status.textContent = 'Debes iniciar sesión para registrar un perro.';
          status.className = 'text-sm text-red-600 text-center';
          submitBtn.disabled = true;
        }

        async function loadUsuariosAndDefault() {
          if (!currentUser || !currentUser.id) return;

          try {
            const res = await fetch('http://localhost:3000/usuarios');
            const usuarios = await res.json();
            userSelect.innerHTML = '';

            if (isAdmin) {
              userSelect.innerHTML = '<option value="">Selecciona usuario</option>';
              usuarios.forEach((u) => {
                const opt = document.createElement('option');
                opt.value = String(u.id);
                opt.textContent = `${u.nombre} ${u.apellido} (${u.email})`;
                userSelect.appendChild(opt);
              });
            } else {
              userSelect.innerHTML = `<option value="${currentUser.id}">${currentUser.nombre || 'Usuario actual'}</option>`;
              userSelect.value = String(currentUser.id);
              userSelect.disabled = true;
            }
          } catch (err) {
            userSelect.innerHTML = '<option value="">No se pudieron cargar usuarios</option>';
          }
        }

        async function loadPerroForEdit(id) {
          try {
            const res = await fetch(`http://localhost:3000/perros/${id}`);
            if (!res.ok) throw new Error('No se pudo cargar el perro');
            const perro = await res.json();

            document.getElementById('perro-nombre').value = perro.nombre || '';
            document.getElementById('perro-raza').value = perro.raza || '';
            document.getElementById('perro-genero').value = String(perro.genero ?? '');
            document.getElementById('perro-fecha').value = perro.fecha_de_nacimiento || '';
            userSelect.value = String(perro.id_usuario || '');

            submitBtn.textContent = 'Guardar cambios';
            status.textContent = 'Editando perro existente';
            status.className = 'text-sm text-blue-600 text-center';
          } catch (err) {
            status.textContent = err.message;
            status.className = 'text-sm text-red-600 text-center';
          }
        }

        await loadUsuariosAndDefault();
        if (editingId) {
          await loadPerroForEdit(editingId);
        }

        form.addEventListener('submit', async (e) => {
          e.preventDefault();
          status.textContent = '';
          submitBtn.disabled = true;
          const originalText = submitBtn.textContent;
          submitBtn.textContent = 'Enviando...';

          const nombre = document.getElementById('perro-nombre').value.trim();
          const raza = document.getElementById('perro-raza').value.trim();
          const generoVal = document.getElementById('perro-genero').value;
          const fecha = document.getElementById('perro-fecha').value || null;

          if (!nombre || !raza || generoVal === "") {
            status.textContent = 'Completa los campos: nombre, raza y género.';
            status.className = 'text-sm text-red-600 text-center';
            submitBtn.disabled = false;
            submitBtn.textContent = originalText;
            return;
          }

          const genero = generoVal === "1" ? 1 : 0;
          const idUsuario = Number(userSelect.value);
          let payload = { nombre, raza, genero, fecha_de_nacimiento: fecha, id_usuario: idUsuario };

          if (!payload.id_usuario) {
            status.textContent = 'Sesión inválida. Vuelve a iniciar sesión.';
            status.className = 'text-sm text-red-600 text-center';
            submitBtn.disabled = false;
            submitBtn.textContent = originalText;
            return;
          }

          try {
            const url = editingId ? `http://localhost:3000/perros/${editingId}` : 'http://localhost:3000/perros';
            const method = editingId ? 'PUT' : 'POST';
            const res = await fetch(url, {
              method,
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload)
            });

            // intenta parsear JSON (si existe)
            let data = {};
            try { data = await res.json(); } catch (e) {}

            if (!res.ok) {
              const msg = window.canemGetApiErrorMessage
                ? window.canemGetApiErrorMessage(data, 'Error al guardar el perro.')
                : (data?.error || data?.message || 'Error al guardar el perro.');
              throw new Error(msg);
            }

            // éxito
            status.textContent = editingId
              ? 'Perro actualizado correctamente. Redirigiendo a hogar...'
              : 'Perro añadido correctamente. Redirigiendo a hogar...';
            status.className = 'text-sm text-green-600 text-center';
            await Swal.fire({
              icon: 'success',
              text: editingId ? 'Perro actualizado correctamente.' : 'Perro añadido correctamente.',
              timer: 1400,
              showConfirmButton: false
            });
            setTimeout(() => window.location.href = '../app/hogar.html', 900);
          } catch (err) {
            status.textContent = err.message || 'Error desconocido. Intenta más tarde.';
            status.className = 'text-sm text-red-600 text-center';
            await Swal.fire({ icon: 'error', text: status.textContent });
          } finally {
            submitBtn.disabled = false;
            submitBtn.textContent = originalText;
          }
        });
      });
    </script>
  </body>
</html>
