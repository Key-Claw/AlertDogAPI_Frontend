<!DOCTYPE html>
<html class="scroll-smooth" lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Portal - Canem</title>
    <script type="module" src="/assets/js/tailwind.config.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="/assets/css/style.css" rel="stylesheet"/>
    <script defer src="/assets/js/scripts.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet"/>
  </head>
  <body class="font-body antialiased bg-gray-50 text-gray-700">
    <header class="fixed w-full z-50 bg-white/90 backdrop-blur border-b">
      <div class="container mx-auto px-6 py-4 flex items-center justify-between">
        <a class="flex items-center gap-3" href="/pages/public/index.html">
          <img src="/public/favicon.jpeg" alt="Canem" class="w-10 h-10 rounded-xl object-cover"/>
          <span class="text-2xl font-bold text-accent">Canem</span>
        </a>
        <nav class="hidden md:flex items-center gap-8">
          <a href="/pages/public/index.html" class="font-medium hover:text-primary">Inicio</a>
          <a href="/pages/public/services.html" class="font-medium hover:text-primary">Servicios</a>
          <a href="/pages/public/about.html" class="font-medium hover:text-primary">Conócenos</a>
          <a href="/pages/public/contact.html" class="font-medium hover:text-primary">Contacto</a>
        </nav>
        <div id="header-actions" class="hidden md:flex items-center gap-4"></div>
        <button id="mobile-menu-toggle" class="md:hidden w-10 h-10 rounded-xl bg-white shadow flex items-center justify-center">
          <i class="fas fa-bars"></i>
        </button>
      </div>
      <div id="mobile-menu" class="hidden px-6 pb-6">
        <div id="mobile-header-actions"></div>
      </div>
    </header>

    <main class="pt-28 pb-12">
      <div class="container mx-auto px-6 max-w-4xl">
        <div class="soft-card p-8 md:p-10">
          <h1 class="text-3xl font-extrabold text-accent mb-3">Portal</h1>
          <p class="text-gray-600 mb-8">Accesos rápidos para gestionar tu cuenta, perros y citas.</p>
          <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <a href="/pages/app/hogar.html" class="soft-btn px-5 py-4 text-center font-bold text-primary">Hogar</a>
            <a href="/pages/app/citas.html" class="soft-btn px-5 py-4 text-center font-bold text-primary">Citas</a>
            <a href="/pages/app/perfil.html" class="soft-btn px-5 py-4 text-center font-bold text-primary">Perfil</a>
          </div>
        </div>
      </div>
    </main>

    <footer class="bg-white border-t mt-12">
      <div class="container mx-auto px-6 py-6 text-gray-500">
        © <span id="year"></span> Canem
      </div>
    </footer>

    <script>
      const y = document.getElementById('year');
      if (y) y.textContent = new Date().getFullYear();
      const btn = document.getElementById('mobile-menu-toggle');
      const menu = document.getElementById('mobile-menu');
      if (btn && menu) btn.addEventListener('click', () => menu.classList.toggle('hidden'));
      if (window.renderHeaderActions) renderHeaderActions();
    </script>
  </body>
</html>
