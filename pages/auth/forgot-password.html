<!DOCTYPE html>
<html class="scroll-smooth" lang="es">
  <head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Recuperar contraseña - Canem</title>
    <script type="module" src="../../assets/js/tailwind.config.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"/>
    <link href="/assets/css/style.css" rel="stylesheet"/>
    <script type="module" defer src="/assets/js/scripts.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet"/>
  </head>
  <body class="font-body antialiased bg-gray-50 text-gray-700">
    <header class="fixed w-full z-50 transition-all duration-300 bg-white/90 backdrop-blur-md border-b border-white/20">
      <div class="container mx-auto px-6 py-4">
        <div class="flex items-center justify-between">
          <a class="flex items-center gap-3 group" href="/pages/public/index.html">
            <img src="/public/favicon.jpeg" alt="Canem logo" class="w-10 h-10 rounded-xl object-cover shadow-sm" />
            <span class="text-2xl font-bold text-accent tracking-tight group-hover:text-primary transition-colors">Canem</span>
          </a>

          <nav class="hidden md:flex items-center gap-8">
            <a class="text-accent font-medium hover:text-primary transition-colors" href="/pages/public/index.html">Inicio</a>
            <a class="text-accent font-medium hover:text-primary transition-colors" href="/pages/public/services.html">Servicios</a>
            <a class="text-accent font-medium hover:text-primary transition-colors" href="/pages/public/about.html">Sobre nosotros</a>
            <a class="text-accent font-medium hover:text-primary transition-colors" href="/pages/public/contact.html">Contacto</a>
          </nav>

          <div id="header-actions" class="hidden md:flex items-center gap-4" aria-live="polite"></div>

          <button id="mobile-menu-toggle" class="md:hidden w-10 h-10 rounded-xl bg-white text-accent flex items-center justify-center shadow-sm" aria-expanded="false" aria-label="Toggle menu">
            <i class="fas fa-bars"></i>
          </button>
        </div>

        <div id="mobile-menu" class="hidden md:hidden mt-4 bg-white rounded-xl p-6 shadow-lg" aria-hidden="true">
          <a class="block py-2 text-accent font-medium hover:text-primary" href="/pages/public/index.html">Inicio</a>
          <a class="block py-2 text-accent font-medium hover:text-primary" href="/pages/public/services.html">Servicios</a>
          <a class="block py-2 text-accent font-medium hover:text-primary" href="/pages/public/about.html">Sobre nosotros</a>
          <a class="block py-2 text-accent font-medium hover:text-primary" href="/pages/public/contact.html">Contacto</a>
          <div id="mobile-header-actions" class="mt-4"></div>
        </div>
      </div>
    </header>

    <main class="pt-28 min-h-screen flex items-center">
      <div class="container mx-auto px-6 max-w-md">
        <div class="soft-card p-8 md:p-12">
          <h1 class="text-3xl font-bold text-accent mb-2">Recuperar contraseña</h1>
          <p class="text-gray-600 mb-6">Introduce tu correo y te enviaremos instrucciones para restablecer tu contraseña.</p>

          <form id="forgotForm" class="space-y-4">
            <div>
              <label for="forgot-email" class="block text-gray-600 mb-2 font-semibold">Correo electrónico</label>
              <input id="forgot-email" class="soft-input w-full px-4 py-3" placeholder="tu@correo.com" type="email" required/>
            </div>

            <button class="soft-btn soft-btn-primary w-full py-4 font-bold text-lg rounded-lg" type="submit">Enviar enlace</button>
          </form>

          <p class="mt-6 text-center text-gray-600">¿Recordaste tu contraseña? <a class="text-primary font-bold" href="/pages/auth/login.html">Inicia sesión</a></p>
        </div>
      </div>
    </main>

    <footer class="bg-[#F9F9F9] pt-20 pb-10 border-t border-white/50">
      <div class="container mx-auto px-6">
        <div class="border-t border-gray-200 pt-8 flex flex-col md:flex-row items-center justify-between gap-4">
          <p class="text-gray-500 text-sm">© <span id="year"></span> Canem. Todos los derechos reservados.</p>
        </div>
      </div>
    </footer>

    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const y = document.getElementById('year');
        if (y) y.textContent = new Date().getFullYear();

        const form = document.getElementById('forgotForm');
        form.addEventListener('submit', async (e) => {
          e.preventDefault();
          await Swal.fire({
            icon: 'success',
            text: 'Si el correo existe, recibirás instrucciones para restablecer tu contraseña.'
          });
          location.href = '/pages/auth/login.html';
        });
      });
    </script>
  </body>
</html>
