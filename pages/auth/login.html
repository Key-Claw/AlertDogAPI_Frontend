<!DOCTYPE html>
<html class="scroll-smooth" lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Iniciar sesión - Canem</title>
    <script type="module" src="../../assets/js/tailwind.config.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"/>
    <link href="../../assets/css/style.css" rel="stylesheet"/>
    <script type="module" defer src="../../assets/js/scripts.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet"/>
  </head>

  <body class="font-body antialiased bg-gray-50 text-gray-700">
    <!-- Header (usa #header-actions y #mobile-header-actions para inyección JS) -->
    <header class="fixed w-full z-50 transition-all duration-300 bg-white/90 backdrop-blur-md border-b border-white/20">
      <div class="container mx-auto px-6 py-4">
        <div class="flex items-center justify-between">
          <a class="flex items-center gap-3 group" href="/pages/public/index.html">
            <img src="../../public/favicon.jpeg" alt="Canem logo" class="w-10 h-10 rounded-xl object-cover shadow-sm" />
            <span class="text-2xl font-bold text-accent tracking-tight group-hover:text-primary transition-colors">Canem</span>
          </a>

          <nav class="hidden md:flex items-center gap-8">
            <a class="text-accent font-medium hover:text-primary transition-colors" href="../../pages/public/index.html">Inicio</a>
            <a class="text-accent font-medium hover:text-primary transition-colors" href="../../pages/public/services.html">Servicios</a>
            <a class="text-accent font-medium hover:text-primary transition-colors" href="../../pages/public/about.html">Sobre nosotros</a>
            <a class="text-accent font-medium hover:text-primary transition-colors" href="../../pages/public/contact.html">Contacto</a>
          </nav>

          <!-- Aquí inyecta scripts.js los botones (Login / Registrarse) o (Tus perros / Logout) -->
          <div id="header-actions" class="hidden md:flex items-center gap-4" aria-live="polite"></div>

          <button id="mobile-menu-toggle" class="md:hidden w-10 h-10 rounded-xl bg-white text-accent flex items-center justify-center shadow-sm" aria-expanded="false" aria-label="Toggle menu">
            <i class="fas fa-bars"></i>
          </button>
        </div>

        <div id="mobile-menu" class="hidden md:hidden mt-4 bg-white rounded-xl p-6 shadow-lg" aria-hidden="true">
          <a class="block py-2 text-accent font-medium hover:text-primary" href="../../pages/public/index.html">Inicio</a>
          <a class="block py-2 text-accent font-medium hover:text-primary" href="../../pages/public/services.html">Servicios</a>
          <a class="block py-2 text-accent font-medium hover:text-primary" href="../../pages/public/about.html">Sobre nosotros</a>
          <a class="block py-2 text-accent font-medium hover:text-primary" href="../../pages/public/contact.html">Contacto</a>

          <!-- Contenedor móvil para acciones inyectadas por JS -->
          <div id="mobile-header-actions" class="mt-4"></div>

        </div>
      </div>
    </header>

    <!-- Login -->
    <main class="pt-28 min-h-screen flex items-center">
      <div class="container mx-auto px-6 max-w-md">
        <div class="soft-card p-8 md:p-12">
          <h1 class="text-3xl font-bold text-accent mb-2">Iniciar sesión</h1>
          <p class="text-gray-600 mb-6">Accede a tu panel para ver y gestionar tus perros.</p>

          <form id="loginForm" class="space-y-4">
            <div>
              <label for="login-username" class="block text-gray-600 mb-2 font-semibold">Usuario</label>
              <input id="login-username" class="soft-input w-full px-4 py-3" placeholder="tuusuario" type="text" required/>
            </div>
            <div>
              <label for="login-password" class="block text-gray-600 mb-2 font-semibold">Contraseña</label>
              <input id="login-password" class="soft-input w-full px-4 py-3" placeholder="********" type="password" required/>
            </div>

            <button id="loginBtn" class="soft-btn soft-btn-primary w-full py-4 font-bold text-lg rounded-lg" type="submit">Entrar</button>
          </form>

          <p class="mt-6 text-center text-gray-600">¿No tienes cuenta? <a class="text-primary font-bold" href="../../pages/auth/register.html">Regístrate</a></p>
        </div>
      </div>
    </main>

    <!-- Footer (puedes mantener tu footer habitual) -->
    <footer class="bg-[#F9F9F9] pt-20 pb-10 border-t border-white/50">
      <div class="container mx-auto px-6">
        <div class="border-t border-gray-200 pt-8 flex flex-col md:flex-row items-center justify-between gap-4">
          <p class="text-gray-500 text-sm">© <span id="year"></span> Canem. Todos los derechos reservados.</p>
        </div>
      </div>
    </footer>

    <script>
      document.addEventListener('DOMContentLoaded', () => {
        // Permitir cambiar de cuenta desde esta pantalla aunque exista sesión activa.

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
          e.preventDefault();
          const username = document.getElementById('login-username').value.trim();
          const password = document.getElementById('login-password').value.trim();
          try {
            const res = await fetch('http://localhost:3000/usuarios');
            const usuarios = await res.json();
            if (!res.ok || !Array.isArray(usuarios)) {
              throw new Error('No se pudo conectar con el backend');
            }

            const found = usuarios.find((u) => {
              const identifier = username.toLowerCase();
              const emailMatch = String(u.email || '').toLowerCase() === identifier;
              const phoneMatch = String(u.telefono || '') === username;
              const nameMatch = String(u.nombre || '').toLowerCase() === identifier;
              return (emailMatch || phoneMatch || nameMatch) && String(u.password || '') === password;
            });

            if (!found) throw new Error('Credenciales inválidas');

            // Guardar sesión local sin exponer contraseña.
            const { password: _pwd, ...safeUser } = found;
            localStorage.setItem('canem_token', 'local-session');
            localStorage.setItem('canem_user', JSON.stringify(safeUser));
            // redirigir basado en rol
            if (found.rol) {
              location.href = '../../pages/app/usuarios.html';
            } else {
              location.href = '../../pages/app/perfil.html';
            }
          } catch (err) {
            await Swal.fire({
              icon: 'error',
              text: 'Error: ' + err.message
            });
          }
        });
      });
    </script>
  </body>
</html>
