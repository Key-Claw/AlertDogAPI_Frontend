<!DOCTYPE html>
<html class="scroll-smooth" lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Registro - Canem</title>
    <script type="module" src="../../assets/js/tailwind.config.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"/>
    <link href="../../assets/css/style.css" rel="stylesheet"/>
    <script type="module" defer src="../../assets/js/scripts.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet"/>
  </head>

  <body class="font-body antialiased bg-gray-50 text-gray-700">
    <!-- Header (igual que en login.html) -->
    <header class="fixed w-full z-50 transition-all duration-300 bg-white/90 backdrop-blur-md border-b border-white/20">
      <div class="container mx-auto px-6 py-4">
        <div class="flex items-center justify-between">
          <a class="flex items-center gap-3 group" href="/pages/public/index.html">
            <img src="../../public/favicon.jpeg" alt="Canem logo" class="w-10 h-10 rounded-xl object-cover shadow-sm" />
            <span class="text-2xl font-bold text-accent tracking-tight group-hover:text-primary transition-colors">Canem</span>
          </a>

          <nav class="hidden md:flex items-center gap-8">
            <a class="text-accent font-medium hover:text-primary transition-colors" href="../public/index.html">Inicio</a>
            <a class="text-accent font-medium hover:text-primary transition-colors" href="../public/services.html">Servicios</a>
            <a class="text-accent font-medium hover:text-primary transition-colors" href="../public/about.html">Sobre nosotros</a>
            <a class="text-accent font-medium hover:text-primary transition-colors" href="../public/contact.html">Contacto</a>
          </nav>

          <div id="header-actions" class="hidden md:flex items-center gap-4" aria-live="polite"></div>

          <button id="mobile-menu-toggle" class="md:hidden w-10 h-10 rounded-xl bg-white text-accent flex items-center justify-center shadow-sm" aria-expanded="false" aria-label="Toggle menu">
            <i class="fas fa-bars"></i>
          </button>
        </div>

        <div id="mobile-menu" class="hidden md:hidden mt-4 bg-white rounded-xl p-6 shadow-lg" aria-hidden="true">
          <a class="block py-2 text-accent font-medium hover:text-primary" href="../public/index.html">Inicio</a>
          <a class="block py-2 text-accent font-medium hover:text-primary" href="../public/services.html">Servicios</a>
          <a class="block py-2 text-accent font-medium hover:text-primary" href="../public/about.html">Sobre nosotros</a>
          <a class="block py-2 text-accent font-medium hover:text-primary" href="../public/contact.html">Contacto</a>

          <div id="mobile-header-actions" class="mt-4"></div>

        </div>
      </div>
    </header>

    <!-- Registro -->
    <main class="pt-28 min-h-screen flex items-center">
      <div class="container mx-auto px-6 max-w-md">
        <div class="soft-card p-8 md:p-12">
          <h1 class="text-3xl font-bold text-accent mb-2">Crear cuenta</h1>
          <p class="text-gray-600 mb-6">Regístrate para gestionar tus perros y pedir videoconferencias.</p>

          <form id="registerForm" class="space-y-4" novalidate>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div>
                <label for="nombre" class="block text-gray-600 mb-2 font-semibold">Nombre</label>
                <input id="nombre" name="nombre" class="soft-input w-full px-4 py-3" placeholder="Tu nombre" type="text" required />
              </div>

              <div>
                <label for="apellido" class="block text-gray-600 mb-2 font-semibold">Apellido</label>
                <input id="apellido" name="apellido" class="soft-input w-full px-4 py-3" placeholder="Tu apellido" type="text" required />
              </div>
            </div>

            <div>
              <label for="email" class="block text-gray-600 mb-2 font-semibold">Correo electrónico</label>
              <input id="email" name="email" class="soft-input w-full px-4 py-3" placeholder="tu@correo.com" type="email" required />
            </div>

            <div>
              <label for="telefono" class="block text-gray-600 mb-2 font-semibold">Teléfono</label>
              <input id="telefono" name="telefono" class="soft-input w-full px-4 py-3" placeholder="Ej. 600 123 456" type="tel" pattern="[0-9\s+()-]{6,15}" required />
            </div>

            <div>
              <label for="localidad" class="block mb-2 font-semibold">Localidad</label>
              <input type="text" id="localidad" name="localidad" class="w-full rounded-lg border px-4 py-3" placeholder="Ej: Zaragoza Centro"/>
            </div>

            <div>
              <label for="reg-password" class="block text-gray-600 mb-2 font-semibold">Contraseña</label>
              <input id="reg-password" name="password" class="soft-input w-full px-4 py-3" placeholder="mín. 6 caracteres" type="password" minlength="6" required />
            </div>

            <button id="registerBtn" class="soft-btn soft-btn-primary w-full py-4 font-bold text-lg rounded-lg" type="submit">Registrarse</button>
          </form>

          <p class="mt-6 text-center text-gray-600">¿Ya tienes cuenta? <a class="text-primary font-bold" href="./login.html">Inicia sesión</a></p>
        </div>
      </div>
    </main>

    <footer class="bg-[#F9F9F9] pt-20 pb-10 border-t border-white/20">
      <div class="container mx-auto px-6">
        <div class="border-t border-gray-200 pt-8 flex flex-col md:flex-row items-center justify-between gap-4">
          <p class="text-gray-500 text-sm">© <span id="year"></span> Canem. Todos los derechos reservados.</p>
        </div>
      </div>
    </footer>

    <script>
      // script para registro 
      document.addEventListener('DOMContentLoaded', () => {
        // año en el footer
        const y = document.getElementById('year');
        if (y) y.textContent = new Date().getFullYear();

        // si el usuario ya está logueado, redirigir al portal
        try {
          const raw = localStorage.getItem('canem_user');
          if (raw) location.href = '/pages/app/portal.html';
        } catch(e) { /* ignore */ }

        const form = document.getElementById('registerForm');
        form.addEventListener('submit', async (e) => {
          e.preventDefault();

          const nombre = document.getElementById('nombre').value.trim();
          const apellido = document.getElementById('apellido').value.trim();
          const email = document.getElementById('email').value.trim();
          const telefono = document.getElementById('telefono').value.trim();
          const password = document.getElementById('reg-password').value;

          // Validación básica
          if (!nombre || !apellido || !email || !password || !telefono) {
            await Swal.fire({ icon: 'warning', text: 'Por favor completa todos los campos obligatorios.' });
            return;
          }
          if (password.length < 6) {
            await Swal.fire({ icon: 'warning', text: 'La contraseña debe tener al menos 6 caracteres.' });
            return;
          }
          // validar formato del email con regex simple
          const emailRe = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
          if (!emailRe.test(email)) {
            await Swal.fire({ icon: 'warning', text: 'Introduce un correo electrónico válido.' });
            return;
          }

          try {
            const res = await fetch('http://localhost:3000/usuarios', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                rol: 0,
                nombre,
                apellido,
                email,
                telefono,
                password
              })
            });

            const data = await res.json();
            if (!res.ok) {
              const msg = data?.error || data?.message || 'Error al registrarse';
              throw new Error(msg);
            }

            // Crear sesión local con el usuario recién registrado.
            localStorage.setItem('canem_token', 'local-session');
            localStorage.setItem('canem_user', JSON.stringify({
              id: data.id_usuario,
              rol: 0,
              nombre,
              apellido,
              email,
              telefono
            }));

            await Swal.fire({ icon: 'success', text: 'Cuenta creada correctamente.' });
            // redirigir al portal
            location.href = '../app/portal.html';
          } catch (err) {
            await Swal.fire({ icon: 'error', text: 'Error: ' + (err.message || 'No se pudo completar el registro.') });
          }
        });
      });
    </script>
  </body>
</html>
