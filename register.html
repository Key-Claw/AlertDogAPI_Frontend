<!DOCTYPE html>
<html class="scroll-smooth" lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Registro — Canem</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="tailwind.config.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"/>
    <link href="style.css" rel="stylesheet"/>
    <script defer src="scripts.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet"/>
  </head>

  <body class="font-body antialiased bg-gray-50 text-gray-700">
    <!-- Header (igual que en login.html) -->
    <header class="fixed w-full z-50 transition-all duration-300 bg-white/90 backdrop-blur-md border-b border-white/20">
      <div class="container mx-auto px-6 py-4">
        <div class="flex items-center justify-between">
          <a class="flex items-center gap-3 group" href="index.html">
            <img src="public/favicon.jpeg" alt="Canem logo" class="w-10 h-10 rounded-xl object-cover shadow-sm" />
            <span class="text-2xl font-bold text-accent tracking-tight group-hover:text-primary transition-colors">Canem</span>
          </a>

          <nav class="hidden md:flex items-center gap-8">
            <a class="text-accent font-medium hover:text-primary transition-colors" href="index.html">Inicio</a>
            <a class="text-accent font-medium hover:text-primary transition-colors" href="services.html">Servicios</a>
            <a class="text-accent font-medium hover:text-primary transition-colors" href="about.html">Sobre nosotros</a>
            <a class="text-accent font-medium hover:text-primary transition-colors" href="contact.html">Contacto</a>
          </nav>

          <div id="header-actions" class="hidden md:flex items-center gap-4" aria-live="polite"></div>

          <button id="mobile-menu-toggle" class="md:hidden w-10 h-10 rounded-xl bg-white text-accent flex items-center justify-center shadow-sm" aria-expanded="false" aria-label="Toggle menu">
            <i class="fas fa-bars"></i>
          </button>
        </div>

        <div id="mobile-menu" class="hidden md:hidden mt-4 bg-white rounded-xl p-6 shadow-lg" aria-hidden="true">
          <a class="block py-2 text-accent font-medium hover:text-primary" href="index.html">Inicio</a>
          <a class="block py-2 text-accent font-medium hover:text-primary" href="services.html">Servicios</a>
          <a class="block py-2 text-accent font-medium hover:text-primary" href="about.html">Sobre nosotros</a>
          <a class="block py-2 text-accent font-medium hover:text-primary" href="contact.html">Contacto</a>

          <div id="mobile-header-actions" class="mt-4"></div>

          <a class="block mt-4 py-2 text-center rounded-xl bg-white text-primary font-bold border" href="booking.html">Pedir cita</a>
        </div>
      </div>
    </header>

    <!-- Registro -->
    <main class="pt-28 min-h-screen flex items-center">
      <div class="container mx-auto px-6 max-w-md">
        <div class="soft-card p-8 md:p-12">
          <h1 class="text-3xl font-bold text-accent mb-2">Crear cuenta</h1>
          <p class="text-gray-600 mb-6">Regístrate para gestionar tus perros y pedir videoconferencias.</p>

          <form id="registerForm" class="space-y-4">
            <div>
              <label for="reg-username" class="block text-gray-600 mb-2 font-semibold">Usuario</label>
              <input id="reg-username" class="soft-input w-full px-4 py-3" placeholder="tuusuario" type="text" required/>
            </div>

            <div>
              <label for="reg-password" class="block text-gray-600 mb-2 font-semibold">Contraseña</label>
              <input id="reg-password" class="soft-input w-full px-4 py-3" placeholder="mín. 6 caracteres" type="password" minlength="6" required/>
            </div>

            <button id="registerBtn" class="soft-btn w-full py-4 font-bold text-lg bg-primary text-white rounded-lg" type="submit">Registrarse</button>
          </form>

          <p class="mt-6 text-center text-gray-600">¿Ya tienes cuenta? <a class="text-primary font-bold" href="login.html">Inicia sesión</a></p>
        </div>
      </div>
    </main>

    <footer class="bg-[#F9F9F9] pt-20 pb-10 border-t border-white/20">
      <div class="container mx-auto px-6">
        <div class="border-t border-gray-200 pt-8 flex flex-col md:flex-row items-center justify-between gap-4">
          <p class="text-gray-500 text-sm">© <span id="year"></span> Canem. Todos los derechos reservados.</p>
        </div>
      </div>
    </footer>

    <script>
      // Si el usuario ya está logueado, redirigir al portal
      document.addEventListener('DOMContentLoaded', () => {
        try {
          const raw = localStorage.getItem('canem_user');
          if (raw) location.href = 'portal.html';
        } catch(e) { /* ignore */ }

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
          e.preventDefault();
          const username = document.getElementById('reg-username').value.trim();
          const password = document.getElementById('reg-password').value.trim();
          try {
            const res = await fetch('/api/auth/register', {
              method: 'POST',
              headers: {'Content-Type':'application/json'},
              body: JSON.stringify({ username, password })
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || 'Error al registrarse');
            localStorage.setItem('canem_token', data.token);
            localStorage.setItem('canem_user', JSON.stringify(data.user));
            location.href = 'portal.html';
          } catch (err) {
            alert('Error: ' + err.message);
          }
        });
      });
    </script>
  </body>
</html>
